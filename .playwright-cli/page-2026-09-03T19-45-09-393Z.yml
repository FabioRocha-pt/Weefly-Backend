  - generic [ref=f3e219]:
    - heading "3 · Duas respostas tuas" [level=3] [ref=f3e220]
    - list [ref=f3e221]:
      - listitem [ref=f3e222]: C-23 — em que ecrã aparece o contador «3»?
      - listitem [ref=f3e223]: C-22 — a linguagem da tua apresentação, se quiseres que o texto a siga. A mistura de línguas, que era o defeito visível, já está corrigida.
  - heading "Duas coisas que encontrei e que não estavam na lista" [level=2] [ref=f3e224]
  - paragraph [ref=f3e225]: Hidratação quebrada no back-office. O bloco de estilos das fontes emite aspas escapadas no servidor e cruas no cliente, o que faz o React desistir e redesenhar toda a raiz no browser. Não é do Sprint 3, mas é real e degrada todos os ecrãs do back-office. Vale um item no Sprint 4.
  - paragraph [ref=f3e226]: O grafo do projeto estava desactualizado e cobria apenas a camada de autenticação — nenhum dos ecrãs do Concierge. Foi reconstruído, e as migrações passaram a entrar nele.
  - heading "Nota sobre o método" [level=2] [ref=f3e227]
  - paragraph [ref=f3e228]: "Onze itens estão marcados «verificado» porque foram abertos no browser e confirmados contra a base de dados real, não apenas compilados. Essa distinção é deliberada: o C-02 é o exemplo de porque importa — o código estava correcto desde o Sprint 2 e a falha que viste tinha outra causa. Os restantes dez compilam e passam as verificações automáticas, mas ainda não foram clicados."
  - paragraph [ref=f3e229]:
    - text: Ficaram três casos de teste com dados alterados durante a verificação (
    - code [ref=f3e230]: WF-2608-0052
    - text: reclamado,
    - code [ref=f3e231]: WF-2609-0055
    - text: fechado,
    - code [ref=f3e232]: WF-2609-0056
    - text: com a ida movida). Todos reversíveis.
  - paragraph [ref=f3e233]: WeeFly Concierge · estado de execução do Sprint 3 · 3 de Setembro de 2026 · 22 de 33 correcções feitas · 11 confirmadas no browser · 11 por fazer · 3 à espera de decisão ou de ficheiros · migrações 0014, 0015 e 0016 aplicadas.