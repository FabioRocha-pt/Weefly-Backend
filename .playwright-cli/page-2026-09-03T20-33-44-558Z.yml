  - paragraph [ref=e218]:
    - text: O que falta é a configuração da aplicação dentro dessa máquina. O passo a passo completo está em
    - code [ref=e219]: docs/deploy-ec2.md
    - text: ; o que se segue é o que não pode ser esquecido.
  - generic [ref=e220]:
    - heading "Limite de upload · verificado, não precisa de nada" [level=3] [ref=e221]
    - paragraph [ref=e222]: "Estava a avisar que o NGINX aceita 1 MB por omissão e que isso recusaria comprovativos com 413. Fui ver o painel: está em 128 MB, muito acima dos 8 MB que a aplicação aceita. Não há nada a mudar."
    - paragraph [ref=e223]:
      - text: "O que fica por confirmar é outro número: a emissão gera três PDF no mesmo pedido, e um timeout de proxy curto corta-a a meio. Se a emissão falhar sem explicação, é aí que se olha — em «Additional nginx directives», com"
      - code [ref=e224]: proxy_read_timeout 60s;
      - text: .
  - generic [ref=e225]:
    - heading [level=3] [ref=e226]:
      - text: As variáveis, em
      - code [ref=e227]: .env.production
    - paragraph [ref=e228]:
      - text: Na raiz da aplicação, com
      - code [ref=e229]: chmod 600
      - text: "— tem a chave de serviço da base de dados:"
    - list [ref=e230]:
      - listitem [ref=e231]:
        - code [ref=e232]: CONCIERGE_FROM_EMAIL
        - text: — um endereço. É a correcção do C-03a, e a razão por que nada foi entregue no teste de 3 de Setembro.
      - listitem [ref=e233]:
