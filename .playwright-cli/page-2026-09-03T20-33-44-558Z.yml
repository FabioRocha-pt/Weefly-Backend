        - text: — é o endereço que vai dentro de cada email e forma o link do cliente. Um valor errado aqui manda todos os clientes para um sítio que não existe, e os emails saem na mesma.
      - listitem [ref=e235]:
        - code [ref=e236]: RESEND_WEBHOOK_SECRET
        - text: — sem ela o estado de entrega nunca passa de «enviado» para «entregue».
      - listitem [ref=e237]:
        - code [ref=e238]: WHATSAPP_PHONE_NUMBER_ID
        - text: e
        - code [ref=e239]: WHATSAPP_ACCESS_TOKEN
        - text: — fecham o C-03b.
    - paragraph [ref=e240]:
      - generic [ref=e241]:
        - text: Falta o
        - code [ref=e242]: CONCIERGE_DIAGNOSE_TOKEN
        - text: .
      - text: Sem ele, a rota de diagnóstico responde 404 em produção — e é precisamente a ferramenta que diz se a configuração de email está certa. Qualquer segredo longo serve.
    - paragraph [ref=e243]:
      - text: "E há duas variáveis a retirar:"
      - code [ref=e244]: BO_PASSWORD_FAPI_ROCHA
      - text: e
      - code [ref=e245]: BO_PASSWORD_GOCGO2008
      - text: . Nada no código as lê — são o registo de um utilitário local. São duas passwords de administração num painel, sem servirem para nada.
  - generic [ref=e246]:
    - heading "Enquanto o endereço for provisório · uma coisa é permanente" [level=3] [ref=e247]
    - paragraph [ref=e248]:
      - text: A plataforma está a servir em
      - code [ref=e249]: weefly.duckdns.org
      - text: "para testes, o que é sensato. Duas consequências:"
    - list [ref=e250]:
      - listitem [ref=e251]:
        - text: O webhook do Resend tem de apontar para
        - code [ref=e252]: https://weefly.duckdns.org/api/webhooks/resend
        - text: enquanto for esse o endereço. Se ficar no domínio final, o estado de entrega pára em «enviado» e nunca chega a «entregue».
      - listitem [ref=e253]:
        - text: O PDF do bilhete leva o endereço lá dentro. Um bilhete emitido agora carrega um link
        - code [ref=e254]: duckdns
        - text: dentro do ficheiro, para sempre — e um PDF é uma coisa que o cliente guarda. Quando o endereço mudar, os bilhetes já enviados apontam para um sítio que pode deixar de responder.
    - paragraph [ref=e255]: Testar à vontade. Emitir bilhetes a clientes reais, só depois de o endereço ser o definitivo.
  - generic [ref=e256]:
