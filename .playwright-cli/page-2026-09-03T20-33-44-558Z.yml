    - paragraph [ref=e267]: "Não há nada a configurar. Peço desculpa por ter mantido isto na lista: a informação estava nas nossas próprias notas e eu devia tê-la confirmado antes de a pedir."
    - paragraph [ref=e268]:
      - text: Duas observações que valem por si. A política DMARC é
      - code [ref=e269]: p=reject
      - text: ", a mais estrita que existe — um email cujo remetente não esteja alinhado não vai para spam, é recusado. É por isso que o campo do remetente ter dois endereços (o C-03a) era tão grave, e é a razão de a protecção que lá pusemos valer a pena. E os relatórios DMARC vão para"
      - code [ref=e270]: dmarc_rua@onsecureserver.net
