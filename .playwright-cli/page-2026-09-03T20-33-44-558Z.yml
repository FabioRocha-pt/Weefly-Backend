      - listitem [ref=e211]: C-23 · para o Ivandro — em que ecrã aparece o contador «3»? O backlog manda confirmar antes de começar, e é a única pergunta de desenho que trava trabalho.
      - listitem [ref=e212]: C-22 · a apresentação do Dominik — o critério é "seguir a linguagem usada na apresentação do Dominik", e não a tenho. A mistura de línguas, que era o defeito visível e o que o teste apanhou, já está corrigida; o que falta é afinar o vocabulário por esse documento.
  - heading "O servidor · o que já está e o que falta" [level=2] [ref=e213]
  - paragraph [ref=e214]:
    - text: "A equipa do Sarin entregou a máquina configurada:"
    - generic [ref=e215]:
      - text: EC2 com Node 20, PM2 7.0.4, NGINX, IP fixo
      - code [ref=e216]: 52.30.78.0
      - text: e SSL activo em
      - code [ref=e217]: concierge.weefly.africa
