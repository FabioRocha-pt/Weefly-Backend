  - generic [ref=e271]:
    - heading "Responder ao Sarin" [level=3] [ref=e272]
    - paragraph [ref=e273]: Ele pede o IP público do escritório para restringir o acesso SSH. Neste momento a porta 22 está aberta a todos os endereços da internet — foi deliberado para a instalação, mas não deve ficar assim. É o pedido dele e é o mais urgente da lista dele.
    - paragraph [ref=e274]: "Vale a pena confirmar ao mesmo tempo onde ficam as cópias de segurança da base de dados e quem tem acesso à consola AWS: nada disso está documentado do nosso lado."
