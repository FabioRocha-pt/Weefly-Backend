  - heading "Duas coisas que encontrei e que não estavam na lista" [level=2] [ref=e324]
  - paragraph [ref=e325]: Hidratação quebrada no back-office. O bloco de estilos das fontes emite aspas escapadas no servidor e cruas no cliente, o que faz o React desistir e redesenhar toda a raiz no browser. Não é do Sprint 3, mas é real e degrada todos os ecrãs do back-office. Vale um item no Sprint 4.
  - paragraph [ref=e326]: O grafo do projeto estava desactualizado e cobria apenas a camada de autenticação — nenhum dos ecrãs do Concierge. Foi reconstruído, e as migrações passaram a entrar nele.
  - heading "Nota sobre o método" [level=2] [ref=e327]
  - paragraph [ref=e328]: "Onze itens estão marcados «verificado» porque foram abertos no browser e confirmados contra a base de dados real, não apenas compilados. Essa distinção é deliberada: o C-02 é o exemplo de porque importa — o código estava correcto desde o Sprint 2 e a falha que viste tinha outra causa. Os restantes dez compilam e passam as verificações automáticas, mas ainda não foram clicados."
  - paragraph [ref=e329]:
    - text: Ficaram três casos de teste com dados alterados durante a verificação (
    - code [ref=e330]: WF-2608-0052
    - text: reclamado,
    - code [ref=e331]: WF-2609-0055
    - text: fechado,
    - code [ref=e332]: WF-2609-0056
    - text: com a ida movida). Todos reversíveis.
