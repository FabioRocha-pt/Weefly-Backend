      - text: 1 · Aplicar a migração
      - code [ref=f1e180]: 0016_sprint3_alerts.sql
    - paragraph [ref=f1e181]:
      - text: Sem ela a campainha do C-14 falha na leitura. Traz também as colunas do C-31. As migrações
      - code [ref=f1e182]: "0014"
      - text: e
      - code [ref=f1e183]: "0015"
      - text: já foram aplicadas e verificadas.
