  - generic [ref=f1e211]:
    - heading "4 · Duas respostas tuas" [level=3] [ref=f1e212]
    - list [ref=f1e213]:
      - listitem [ref=f1e214]: C-23 — em que ecrã aparece o contador «3»?
      - listitem [ref=f1e215]: C-22 — a linguagem da tua apresentação, se quiseres que o texto a siga. A mistura de línguas, que era o defeito visível, já está corrigida.
  - heading "Duas coisas que encontrei e que não estavam na lista" [level=2] [ref=f1e216]
  - paragraph [ref=f1e217]: Hidratação quebrada no back-office. O bloco de estilos das fontes emite aspas escapadas no servidor e cruas no cliente, o que faz o React desistir e redesenhar toda a raiz no browser. Não é do Sprint 3, mas é real e degrada todos os ecrãs do back-office. Vale um item no Sprint 4.
  - paragraph [ref=f1e218]: O grafo do projeto estava desactualizado e cobria apenas a camada de autenticação — nenhum dos ecrãs do Concierge. Foi reconstruído, e as migrações passaram a entrar nele.
  - heading "Nota sobre o método" [level=2] [ref=f1e219]
  - paragraph [ref=f1e220]: "Onze itens estão marcados «verificado» porque foram abertos no browser e confirmados contra a base de dados real, não apenas compilados. Essa distinção é deliberada: o C-02 é o exemplo de porque importa — o código estava correcto desde o Sprint 2 e a falha que viste tinha outra causa. Os restantes onze compilam e passam as verificações automáticas, mas ainda não foram clicados."
  - paragraph [ref=f1e221]:
    - text: Ficaram três casos de teste com dados alterados durante a verificação (
    - code [ref=f1e222]: WF-2608-0052
    - text: reclamado,
    - code [ref=f1e223]: WF-2609-0055
    - text: fechado,
    - code [ref=f1e224]: WF-2609-0056
    - text: com a ida movida). Todos reversíveis.
  - paragraph [ref=f1e225]: WeeFly Concierge · estado de execução do Sprint 3 · 3 de Setembro de 2026 · 22 de 33 correcções feitas, 11 por fazer, 3 à espera de decisão ou de ficheiros.