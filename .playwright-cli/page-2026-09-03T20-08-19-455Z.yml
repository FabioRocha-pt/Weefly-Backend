  - heading "Os 9 que faltam · o que cada um precisa" [level=2] [ref=e261]
  - paragraph [ref=e262]: Dos nove, só dois estão à espera de alguém. Os outros sete não dependem de ninguém — mas quatro deles têm uma decisão por tomar, e prefiro dizê-la a adivinhá-la em silêncio.
