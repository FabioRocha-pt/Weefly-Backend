        - 'cell "«As alterações de campo aparecem com o valor antigo e o novo» — mas quais campos? Instrumentar todos enche a aba de ruído. Vou pelos que têm consequência comercial: datas, preços, vendedor, valor a cobrar e método. Se quiseres outros, diz." [ref=e281]'
