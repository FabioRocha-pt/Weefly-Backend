    - paragraph [ref=e251]:
      - text: SPF, DKIM e DMARC. O domínio está verificado no Resend desde Agosto, mas sem estes três registos os emails chegam à caixa de spam de metade dos destinatários — e um cliente que não vê a proposta é uma venda perdida sem ninguém dar por ela. Passo a passo em
