  - heading "Duas coisas que encontrei e que não estavam na lista" [level=2] [ref=e259]
  - paragraph [ref=e260]: Hidratação quebrada no back-office. O bloco de estilos das fontes emite aspas escapadas no servidor e cruas no cliente, o que faz o React desistir e redesenhar toda a raiz no browser. Não é do Sprint 3, mas é real e degrada todos os ecrãs do back-office. Vale um item no Sprint 4.
