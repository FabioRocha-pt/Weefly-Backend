  - heading "O servidor · o que já está e o que falta" [level=2] [ref=e217]
  - paragraph [ref=e218]:
    - text: "A equipa do Sarin entregou a máquina configurada:"
    - generic [ref=e219]:
      - text: EC2 com Node 20, PM2 7.0.4, NGINX, IP fixo
      - code [ref=e220]: 52.30.78.0
      - text: e SSL activo em
      - code [ref=e221]: concierge.weefly.africa
    - text: ". As chaves PEM e PPK chegaram e estão guardadas fora do controlo de versões. Custo estimado: cerca de 45 USD por mês."
  - paragraph [ref=e222]:
    - text: O que falta é a configuração da aplicação dentro dessa máquina. O passo a passo completo está em
    - code [ref=e223]: docs/deploy-ec2.md
    - text: ; o que se segue é o que não pode ser esquecido.
  - generic [ref=e224]:
    - heading "O limite de upload do NGINX — 8 MB, não o valor por omissão" [level=3] [ref=e225]
    - paragraph [ref=e226]: O NGINX aceita 1 MB por omissão. Um comprovativo pode ter até 8 MB, e o que está gravado no sistema neste momento tem 2 MB. Se a máquina ficou com o valor por omissão, os comprovativos de mais de 1 MB são recusados com um erro 413 antes de chegarem à aplicação — e do lado do cliente parece que o envio simplesmente falhou.
    - paragraph [ref=e227]:
      - text: "Vale a pena confirmar isto antes de qualquer outro teste: é a diferença entre o C-02 funcionar e voltar a aparecer no próximo backlog. A configuração está escrita em"
      - code [ref=e228]: docs/deploy-ec2.md
      - text: ", secção 1, com o timeout de 60 segundos que a emissão precisa por gerar três PDF no mesmo pedido."
  - generic [ref=e229]:
    - heading [level=3] [ref=e230]:
      - text: As variáveis, em
      - code [ref=e231]: .env.production
    - paragraph [ref=e232]:
      - text: Na raiz da aplicação, com
      - code [ref=e233]: chmod 600
      - text: "— tem a chave de serviço da base de dados:"
    - list [ref=e234]:
      - listitem [ref=e235]:
        - code [ref=e236]: CONCIERGE_FROM_EMAIL
        - text: — um endereço. É a correcção do C-03a, e a razão por que nada foi entregue no teste de 3 de Setembro.
      - listitem [ref=e237]:
        - code [ref=e238]: NEXT_PUBLIC_SITE_URL=https://concierge.weefly.africa
        - text: — é o endereço que vai dentro de cada email e forma o link do cliente. Um valor errado aqui manda todos os clientes para um sítio que não existe, e os emails saem na mesma.
      - listitem [ref=e239]:
        - code [ref=e240]: RESEND_WEBHOOK_SECRET
        - text: — sem ela o estado de entrega nunca passa de «enviado» para «entregue».
      - listitem [ref=e241]:
        - code [ref=e242]: WHATSAPP_PHONE_NUMBER_ID
        - text: e
        - code [ref=e243]: WHATSAPP_ACCESS_TOKEN
        - text: — fecham o C-03b.
