# ═══════════════════════════════════════════════════════════════════════════
# MIG-02 · o endereço antigo deixa de responder (decisão de 30 de setembro)
# ═══════════════════════════════════════════════════════════════════════════
#
# Substitui o `weefly-duckdns-redirect.conf` do MIG-01. O endereço antigo não
# se redirecciona: os links antigos já enviados deixam de abrir, e isso é uma
# consequência assumida.
#
# `444` fecha a ligação sem resposta. No 443, `ssl_reject_handshake` recusa o
# TLS sem precisar de certificado nenhum — o do duckdns pode ser apagado.
#
# Instalar:
#
#   sudo rm -f /etc/nginx/sites-enabled/weefly-duckdns-redirect.conf \
#              /etc/nginx/sites-available/weefly-duckdns-redirect.conf
#   sudo cp deploy/nginx/weefly-duckdns-off.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/weefly-duckdns-off.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# E tirar `weefly.duckdns.org` de qualquer outro `server_name` que o tenha.
#
# Verificar (as duas têm de falhar, sem página nenhuma):
#
#   curl -sS -o /dev/null -w "%{http_code}\n" http://weefly.duckdns.org/login
#   curl -sS -o /dev/null -w "%{http_code}\n" https://weefly.duckdns.org/login
#
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name weefly.duckdns.org;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name weefly.duckdns.org;
    ssl_reject_handshake on;
}
