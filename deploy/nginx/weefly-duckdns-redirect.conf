# ═══════════════════════════════════════════════════════════════════════════
# MIG-01 · os links antigos do duckdns, redireccionados para sempre
# ═══════════════════════════════════════════════════════════════════════════
#
# Os links privados foram desenhados para nunca expirar, e há links
# `weefly.duckdns.org/pc/…` em emails e WhatsApps já entregues. Este servidor
# só serve um `301` permanente, com o caminho e os parâmetros intactos:
#
#   weefly.duckdns.org/pc/8IdIXN…?view=p5  →  concierge.weefly.africa/pc/8IdIXN…?view=p5
#
# As duas portas, e é esse o ponto do ficheiro: o bloco da Parte 9 do runbook
# só ouvia a 443, e um link antigo em `http://` ficava sem resposta.
#
# Manter durante **pelo menos seis meses** (até abril de 2027, no mínimo).
#
# Instalar, depois de o DuckDNS apontar para o servidor novo:
#
#   sudo cp deploy/nginx/weefly-duckdns-redirect.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/weefly-duckdns-redirect.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d weefly.duckdns.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# Testar com um link real de um caso existente ANTES de desligar o antigo:
#
#   curl -sI "http://weefly.duckdns.org/pc/<token>"  | grep -iE "^(HTTP|location)"
#   curl -sI "https://weefly.duckdns.org/pc/<token>" | grep -iE "^(HTTP|location)"
#
# As duas respostas têm de ser `301` com `location:
# https://concierge.weefly.africa/pc/<token>`.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name weefly.duckdns.org;

    # O desafio do Certbot tem de continuar a responder aqui, para renovar.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://concierge.weefly.africa$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weefly.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/weefly.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weefly.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://concierge.weefly.africa$request_uri;
}
