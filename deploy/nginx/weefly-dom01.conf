# ═══════════════════════════════════════════════════════════════════════════
# WeeFly · DOM-01 · os endereços de produção (atualização de 2 de outubro)
# ═══════════════════════════════════════════════════════════════════════════
#
# ⚠ NÃO ESTÁ INSTALADO. O que está no servidor desde 5 de outubro é o
#   `weefly-pro.conf` (pro + empresas, certificado por HTTP-01). Este ficheiro
#   fica como referência para o bloco `weefly.africa` com o /pc, e só se usa
#   se a decisão Q4 o permitir: o DNS mostrou que `weefly.africa` aponta para
#   outro servidor (34.245.250.2), e não para o EC2.
#
#   pro.weefly.africa          → a aplicação inteira (backoffice WeeFly PRO)
#   <empresa>.weefly.africa    → a aplicação inteira (/pc, /admin, /ministerios)
#   weefly.africa              → o site público (Amadeus) continua onde está;
#                                só /pc e o que o /pc precisa vêm para aqui
#   concierge.weefly.africa    → deixa de existir (decisão Q3): sai deste
#                                ficheiro, do certificado e do DNS
#
# ⚠ Antes de aplicar:
#   1. DNS: `pro` e `*` (wildcard) em weefly.africa a apontar para o EC2.
#   2. Certificado wildcard `*.weefly.africa` + `weefly.africa` (pedido ao
#      Sarin). O Let's Encrypt só passa wildcards por DNS-01:
#        sudo certbot certonly --manual --preferred-challenges dns \
#          -d 'weefly.africa' -d '*.weefly.africa'
#   3. Q4 · confirmar que o site público de weefly.africa está neste servidor
#      e qual é o `root`/`proxy_pass` dele: o bloco `weefly.africa` em baixo
#      tem de ficar com a `location /` que ele já tem hoje.
#   4. `.env.production` (e build de novo: as NEXT_PUBLIC_ entram no build):
#        NEXT_PUBLIC_SITE_URL=https://pro.weefly.africa
#        NEXT_PUBLIC_PC_SITE_URL=https://weefly.africa
#        NEXT_PUBLIC_WEBSITE_URL=https://weefly.africa
#        NEXT_PUBLIC_PARTNER_SITE_URL=https://{slug}.weefly.africa
#        SERVED_HOSTS=pro.weefly.africa,weefly.africa,*.weefly.africa
#        ALLOW_INDEXING=true          # só em produção (SEO-03)
#   5. Supabase › Authentication › URL Configuration:
#        Site URL       https://pro.weefly.africa
#        Redirect URLs  https://pro.weefly.africa/**, https://*.weefly.africa/**
#      e o hook Send Email em https://pro.weefly.africa/api/auth/send-email.
#
# Depois:
#   sudo cp deploy/nginx/weefly-dom01.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/weefly-dom01.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ═══════════════════════════════════════════════════════════════════════════

# O que é comum aos três blocos.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── pro.weefly.africa e <empresa>.weefly.africa ─────────────────────────────

server {
    listen 443 ssl http2;
    server_name pro.weefly.africa ~^(?<company>[a-z0-9-]+)\.weefly\.africa$;

    ssl_certificate     /etc/letsencrypt/live/weefly.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weefly.africa/privkey.pem;

    # O comprovativo do cliente: 8 MB mais a folga do multipart.
    client_max_body_size 12M;
    client_body_timeout  120s;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}

# ── weefly.africa: o site público, com o /pc ao lado ────────────────────────
#
# Só o que é do price checker vem para a aplicação. O /pc precisa também dos
# ficheiros do Next (/_next), das rotas de API que chama (/api/pc, /api/chat,
# /api/airports, /api/cases, /api/flights, /api/weepay), da marca (/brand) e
# das server actions (POST /pc com o cabeçalho Next-Action, já coberto pelo
# /pc). O resto continua no site.

server {
    listen 443 ssl http2;
    server_name weefly.africa;

    ssl_certificate     /etc/letsencrypt/live/weefly.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weefly.africa/privkey.pem;

    client_max_body_size 12M;

    location ~ ^/(pc|_next|brand|api/(pc|chat|airports|cases|flights|weepay|brand))(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # ⚠ Q4 · aqui fica a `location /` que o site público já tem hoje.
    # location / { ... }
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name weefly.africa pro.weefly.africa *.weefly.africa;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
