# ═══════════════════════════════════════════════════════════════════════════
# WeeFly · DOM-01 · pro.weefly.africa e <empresa>.weefly.africa
# No ar desde 5 de outubro de 2026. É este o ficheiro que está no servidor
# (/etc/nginx/sites-available/weefly-pro.conf), não o weefly-dom01.conf.
# ═══════════════════════════════════════════════════════════════════════════
#
#   pro.weefly.africa          → a aplicação inteira (backoffice WeeFly PRO)
#   <empresa>.weefly.africa    → a aplicação inteira (/pc, /admin, /ministerios)
#   concierge.weefly.africa    → continua no ficheiro dele até ser desligado
#                                (decisão Q3). Um server_name exato ganha ao
#                                curinga e à regex, por isso não há conflito.
#
# Certificado: Let's Encrypt por HTTP-01, sem wildcard. O DNS está na GoDaddy
# e um wildcard obrigava a um TXT novo a cada renovação. O certificado
# `weefly-pro` leva todos os subdomínios, um a um. Para juntar uma empresa,
# repetir o comando com TODOS os nomes que já lá estão mais o novo:
#
#   sudo certbot certonly --webroot -w /var/www/letsencrypt \
#     --cert-name weefly-pro \
#     -d pro.weefly.africa -d alo.weefly.africa -d <novo>.weefly.africa \
#     --deploy-hook "systemctl reload nginx"
#
# Uma empresa que ainda não está no certificado abre com aviso de segurança.
#
# Sem `http2` no listen: nesta versão do NGINX ligá-lo aqui ligava-o também
# no concierge (é por endereço:porta). Sem `ipv6only=on`: só pode aparecer
# uma vez por porta, e já está no concierge.
#
# Instalar (o bloco 443 só depois de o certificado existir):
#   sudo mkdir -p /var/www/letsencrypt/.well-known/acme-challenge
#   sudo cp deploy/nginx/weefly-pro.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/weefly-pro.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name pro.weefly.africa *.weefly.africa;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pro.weefly.africa ~^[a-z0-9-]+\.weefly\.africa$;

    ssl_certificate     /etc/letsencrypt/live/weefly-pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weefly-pro/privkey.pem;

    # O comprovativo do cliente: 8 MB mais a folga do multipart.
    client_max_body_size 12M;
    client_body_timeout  120s;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
